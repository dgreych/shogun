name: Sanitização pontual da identidade pública

on:
  push:
    branches:
      - fix/portabilidade-publica-20260824

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portabilidade-publica-20260824
          fetch-depth: 0

      - name: Atualizar mensagens legadas e remover o workflow temporário
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('dados/src/utils/database.js')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r"(ensureJsonFileExists\(MSGBOTON_FILE, \{ enabled: defaultMsgBotOnEnabled,\s*message: `)(.*?)(`\s*\}\);)",
              re.S,
          )
          replacement = """⚔️ ────────────────── ⚔️

      *𝖘𝖍𝖔𝖌𝖚𝖓 no comando*

  Grupo sob controle. Moderação,
  mídia, jogos e economia prontos
  para uso.

  Digite *{prefix}menu* para ver
  tudo o que dá para fazer aqui.

_Para encerrar este aviso nas próximas
inicializações, use *msgboton*._"""
          text, count = pattern.subn(lambda m: m.group(1) + replacement + m.group(3), text, count=1)
          if count != 1:
              raise SystemExit('bloco inicial de msgboton não encontrado de forma única')

          text, online_count = re.subn(
              r"✅ \*GYOMEI est[aá] online\*",
              "✅ *𝖘𝖍𝖔𝖌𝖚𝖓 online*",
              text,
          )
          if online_count != 1:
              raise SystemExit(f'mensagem online esperada uma vez; encontrada {online_count}')

          forbidden = [
              r'GYOMEI est[aá] (desperto|online)',
              r'base d[ao]\s+Nazuna',
              r'continuidade da Nazuna',
              r'vers[aã]o GYOMEI',
          ]
          for item in forbidden:
              if re.search(item, text, flags=re.I):
                  raise SystemExit(f'vestígio público ainda presente em database.js: {item}')

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/identity-sanitize-once.yml').unlink()

      - name: Commitar a correção na própria branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/src/utils/database.js .github/workflows/identity-sanitize-once.yml
          git commit -m "Remover mensagens da identidade anterior"
          git push origin HEAD:fix/portabilidade-publica-20260824
