name: Validar SHOGUN

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sanitizar-identidade:
    name: Sanitizar identidade pública
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/portabilidade-publica-20260824'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar a branch do PR
        uses: actions/checkout@v4
        with:
          ref: fix/portabilidade-publica-20260824
          fetch-depth: 0
      - name: Corrigir mensagens legadas
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('dados/src/utils/database.js')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r"(ensureJsonFileExists\(MSGBOTON_FILE, \{ enabled: defaultMsgBotOnEnabled,\s*message: `)(.*?)(`\s*\}\);)",
              re.S,
          )
          replacement = """⚔️ ────────────────── ⚔️

      *𝖘𝖍𝖔𝖌𝖚𝖓 no comando*

  Grupo sob controle. Moderação,
  mídia, jogos e economia prontos
  para uso.

  Digite *{prefix}menu* para ver
  tudo o que dá para fazer aqui.

_Para encerrar este aviso nas próximas
inicializações, use *msgboton*._"""
          text, count = pattern.subn(lambda m: m.group(1) + replacement + m.group(3), text, count=1)
          if count != 1:
              raise SystemExit('bloco inicial de msgboton não encontrado de forma única')

          text, online_count = re.subn(
              r"✅ \*GYOMEI est[aá] online\*",
              "✅ *𝖘𝖍𝖔𝖌𝖚𝖓 online*",
              text,
          )
          if online_count != 1:
              raise SystemExit(f'mensagem online esperada uma vez; encontrada {online_count}')

          for item in [
              r'GYOMEI est[aá] (desperto|online)',
              r'base d[ao]\s+Nazuna',
              r'continuidade da Nazuna',
              r'vers[aã]o GYOMEI',
          ]:
              if re.search(item, text, flags=re.I):
                  raise SystemExit(f'vestígio público ainda presente em database.js: {item}')

          path.write_text(text, encoding='utf-8')
      - name: Publicar a correção na branch
        run: |
          if git diff --quiet -- dados/src/utils/database.js; then
            echo "database.js já está sanitizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/src/utils/database.js
          git commit -m "Remover mensagens da identidade anterior"
          git push origin HEAD:fix/portabilidade-publica-20260824

  qualidade:
    name: Qualidade completa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Preparar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Inspecionar plataforma
        run: npm run preflight
      - name: Validar arquitetura modular
        run: |
          npm run typecheck:vnext
          npm run build:vnext
          node scripts/plan-vnext-macrotranche.mjs
          node scripts/analyze-vnext-compatibility-debt.mjs
          npm run test:vnext:domain
          npm run test:vnext:routing
          npm run test:vnext:commands
          npm run test:vnext:state
          npm run test:vnext:compat
      - name: Validar runtime atual
        run: npm run validate:ci
      - name: Validar identidade visual
        run: |
          test -s assets/brand/shogun-banner.png
          test -s assets/brand/shogun-mark.png
          node --test test/vnext/console-visual.test.mjs

  portabilidade:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.19.0', '22', '24']
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar dependências em clone limpo
        run: npm ci --no-audit --no-fund
      - name: Conferir instaladores e entradas
        shell: bash
        run: |
          node --check scripts/preflight-platform.mjs
          node --check dados/src/.scripts/config.js
          node --check dados/src/.scripts/start.js
          node --check dados/src/.scripts/start-v9-fixed.js
          node --check dados/src/connect.js
          node --check dados/src/index.js
          bash -n scripts/install-linux.sh
          bash -n scripts/install-macos.sh
          bash -n scripts/install-termux.sh
      - name: Conferir configuração neutra
        run: node -e "const c=require('./dados/src/config.example.json'); if(c.nomebot!=='SHOGUN'||c.numerodono!=='55DDDNUMERO') process.exit(1)"
      - name: Construir arquitetura modular
        run: npm run build:vnext

  contrato-termux:
    name: Contrato Termux/Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js mínimo suportado
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - name: Preparar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Instalar dependências como clone limpo
        run: npm ci --no-audit --no-fund
      - name: Validar script Android
        run: |
          bash -n scripts/install-termux.sh
          grep -q 'nodejs-lts' scripts/install-termux.sh
          grep -q 'ffmpeg' scripts/install-termux.sh
          grep -q 'termux-tools' scripts/install-termux.sh
      - name: Exercitar ramificação Termux do preflight
        env:
          TERMUX_VERSION: ci
          PREFIX: /tmp/shogun-termux-prefix
        run: |
          mkdir -p "$PREFIX/bin"
          touch "$PREFIX/bin/termux-wake-lock"
          node scripts/preflight-platform.mjs
      - name: Validar entradas do runtime
        run: |
          node --check dados/src/.scripts/start-v9-fixed.js
          node --check dados/src/connect.js
          node --check dados/src/index.js
